<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NutriGuide AI — System Architecture</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 20px;
    }

    svg {
      max-width: 1050px;
      width: 100%;
      height: auto;
    }

    .block rect {
      fill: #F5C842;
      stroke: none;
    }

    .arrow line,
    .arrow path,
    .arrow polyline {
      stroke: #1a1a1a;
      stroke-width: 1.6;
      fill: none;
    }

    .arrow polygon {
      fill: #1a1a1a;
      stroke: none;
    }

    .label {
      font-size: 11.5px;
      fill: #222;
      font-style: italic;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>
</head>

<body>

  <svg viewBox="0 0 1060 580" xmlns="http://www.w3.org/2000/svg">

    <!-- ========== USER INPUT ========== -->
    <g class="block">
      <rect x="30" y="230" width="130" height="70" rx="3" />
      <text x="95" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">User Input</text>
    </g>

    <!-- ===== PATH 1 (TOP): Ingredient Label ===== -->
    <!-- Arrow from User Input up-right -->
    <g class="arrow">
      <path d="M 95,230 L 95,110 L 280,110" />
      <polygon points="280,105 290,110 280,115" />
    </g>
    <text class="label" x="175" y="90">Ingredient</text>
    <text class="label" x="175" y="105">label image</text>

    <!-- Ingredient Recognition Block -->
    <g class="block">
      <rect x="290" y="75" width="220" height="70" rx="3" />
      <text x="400" y="102" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a1a">Ingredient
        Recognition</text>
      <text x="400" y="122" text-anchor="middle" font-size="12.5" fill="#1a1a1a">using PaddleOCR</text>
    </g>

    <!-- Arrow to Ingredients Info -->
    <g class="arrow">
      <line x1="510" y1="110" x2="600" y2="110" />
      <polygon points="600,105 610,110 600,115" />
    </g>

    <!-- Ingredients Information Block -->
    <g class="block">
      <rect x="610" y="75" width="200" height="70" rx="3" />
      <text x="710" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Ingredients</text>
      <text x="710" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Information</text>
    </g>

    <!-- ===== PATH 2 (MIDDLE): Food Image ===== -->
    <!-- Arrow from User Input right -->
    <g class="arrow">
      <line x1="160" y1="265" x2="280" y2="265" />
      <polygon points="280,260 290,265 280,270" />
    </g>
    <text class="label" x="220" y="253">Food Image</text>

    <!-- Image Recognition Block -->
    <g class="block">
      <rect x="290" y="230" width="220" height="70" rx="3" />
      <text x="400" y="260" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1a1a1a">Image
        Recognition</text>
      <text x="400" y="280" text-anchor="middle" font-size="12.5" fill="#1a1a1a">using Groq Vision AI</text>
    </g>

    <!-- Arrow to Food Volume -->
    <g class="arrow">
      <line x1="510" y1="265" x2="600" y2="265" />
      <polygon points="600,260 610,265 600,270" />
    </g>

    <!-- Food Volume Estimation Block -->
    <g class="block">
      <rect x="610" y="230" width="200" height="70" rx="3" />
      <text x="710" y="258" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Food Volume</text>
      <text x="710" y="278" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Estimation</text>
    </g>

    <!-- ===== "Food Details" arrow from Food Volume down to DATABASE ===== -->
    <g class="arrow">
      <path d="M 710,300 L 710,370 L 520,370 L 520,410" />
      <polygon points="515,410 520,420 525,410" />
    </g>
    <text class="label" x="625" y="358">Food Details</text>

    <!-- ===== PATH 3 (BOTTOM): Manual Entry ===== -->
    <!-- Arrow from User Input down-right -->
    <g class="arrow">
      <path d="M 95,300 L 95,440 L 370,440" />
      <polygon points="370,435 380,440 370,445" />
    </g>
    <text class="label" x="62" y="370">Manual food</text>
    <text class="label" x="62" y="385">entry with</text>
    <text class="label" x="62" y="400">volume</text>

    <!-- DATABASE Block -->
    <g class="block">
      <rect x="380" y="405" width="190" height="70" rx="3" />
      <text x="475" y="433" text-anchor="middle" font-size="17" font-weight="700" fill="#1a1a1a">DATABASE</text>
      <text x="475" y="455" text-anchor="middle" font-size="12" fill="#1a1a1a">MySQL </text>
    </g>

    <!-- Arrow DATABASE → Nutrients Information -->
    <g class="arrow">
      <line x1="570" y1="440" x2="650" y2="440" />
      <polygon points="650,435 660,440 650,445" />
    </g>

    <!-- Nutrients Information Block -->
    <g class="block">
      <rect x="660" y="405" width="190" height="70" rx="3" />
      <text x="755" y="433" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Nutrients</text>
      <text x="755" y="455" text-anchor="middle" font-size="16" font-weight="700" fill="#1a1a1a">Information</text>
    </g>

    <!-- Arrow Nutrients → Log food -->
    <g class="arrow">
      <line x1="850" y1="440" x2="890" y2="440" />
      <polygon points="890,435 900,440 890,445" />
    </g>
    <text class="label" x="875" y="428"> If log food </text>

    <!-- Log Food Block -->
    <g class="block">
      <rect x="900" y="405" width="150" height="70" rx="3" />
      <text x="975" y="432" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Log food and
        update</text>
      <text x="975" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">nutrition
        dashboard</text>
    </g>

  </svg>

</body>

</html>
